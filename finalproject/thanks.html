<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thank you for your submission on MovieQueue.">
  <title>MovieQueue | Thanks</title>
  <link rel="icon" href="images/favicon.svg" sizes="any">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/project.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">MovieQueue</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">☰</button>
    <nav id="site-nav" aria-label="Primary navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="discover.html">Discover</a></li>
        <li><a href="siteplan.html">Site Plan</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Thanks for your suggestion.</h1>
      <p>Your form was received and saved for review.</p>
      <div class="panel">
        <h2>Your details</h2>
        <p><strong>Name:</strong> <span id="submitted-name"></span></p>
        <p><strong>Email:</strong> <span id="submitted-email"></span></p>
        <p><strong>Movie title:</strong> <span id="submitted-title"></span></p>
        <p><strong>Why it fits:</strong> <span id="submitted-note"></span></p>
      </div>
      <a class="button" href="index.html">Return home</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MovieQueue</p>
  </footer>

  <script src="js/nav.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('submitted-name').textContent = params.get('name') || 'Not provided';
    document.getElementById('submitted-email').textContent = params.get('email') || 'Not provided';
    document.getElementById('submitted-title').textContent = params.get('title') || 'Not provided';
    document.getElementById('submitted-note').textContent = params.get('note') || 'Not provided';
  </script>
</body>
</html>
